name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Wisdoverse/dsh-skills-manager-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish with npm Trusted Publishing
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          case "$package_version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public --tag latest ;;
          esac
